        activity: เดินทางไปร้านอาหาร
        location: รอยืนยัน
        notes: เผื่อเวลาสำหรับการเดินทาง
      - time: รอยืนยัน (ช่วงเย็น)
        activity: รับประทานอาหารเย็นกับครอบครัว
        location: ร้านอาหารรอยืนยัน
        notes: รับประทานอาหารร่วมกันหลังวันซ้อม
  - id: ceremony
