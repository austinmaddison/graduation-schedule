faq:
  title: คำถามที่พบบ่อย
  description: คำถามที่แขกมักถามกันบ่อย ๆ จะมีคำตอบเพิ่มเติมเมื่อรายละเอียดต่าง ๆ ชัดเจนขึ้น
  categories:
    - title: การรับปริญญา
      questions:
        - label: คุณจบปริญญาสาขาอะไร?
          content: วิทยาการคอมพิวเตอร์ (Computer Science)
        - label: ทราบวันและเวลาที่แน่นอนหรือยัง?
          content: >-
            ยังไม่ทราบครับ วันและเวลาที่แน่นอนยังไม่ประกาศ เนื่องจากหลักสูตรอื่น ๆ
            ของมหาวิทยาลัยยังปิดรับลงทะเบียนเข้าร่วมพิธีไม่เสร็จ เมื่อมหาวิทยาลัยยืนยันแล้ว
            หน้านี้จะอัปเดต
    - title: รายละเอียด
      questions:
        - label: การแต่งกายเป็นอย่างไร?
          content: รอยืนยัน — Austin จะแจ้งอีกครั้งเมื่อใกล้วัน
        - label: ต้องแจ้งยืนยันการเข้าร่วม (RSVP) ไหม?
          content: รอยืนยัน — Austin จะแจ้งอีกครั้งเมื่อใกล้วัน
        - label: เรื่องการเดินทางและที่จอดรถเป็นอย่างไร?
          content: รอยืนยัน — Austin จะแจ้งอีกครั้งเมื่อใกล้วัน
        - label: ควรเตรียมของขวัญไหม?
          content: รอยืนยัน — Austin จะแจ้งอีกครั้งเมื่อใกล้วัน
        - label: พาเด็ก ๆ มาด้วยได้ไหม?
          content: รอยืนยัน — Austin จะแจ้งอีกครั้งเมื่อใกล้วัน
