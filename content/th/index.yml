title: คุณได้รับเชิญร่วมงานรับปริญญาของ Austin!
description: มาร่วมยินดีกับผมในเดือนตุลาคม 2569 ที่มหาวิทยาลัยมหิดล ศาลายา ประเทศไทย
seo:
  title: งานรับปริญญาของ Austin · มหาวิทยาลัยมหิดล
  description: คำเชิญสองภาษาสำหรับงานรับปริญญาของ Austin Jetrin Maddison ที่มหาวิทยาลัยมหิดล ศาลายา — กำหนดการ ที่พัก ร้านอาหาร และรายชื่อแขก
plans:
  - id: rehearsal
    letter: A
    title: วันซ้อมรับปริญญา
    date: วันเสาร์ที่ 3 ตุลาคม 2569
    tone: success
    badge: เดินทางง่ายกว่า
    pros:
      - การจราจรไม่ติดมาก
      - ไม่มีการปิดถนน
      - เหนื่อยน้อยกว่า
    cons:
      - ยังไม่ได้รับปริญญาบัตรจริง
    rows:
      - time: รอยืนยัน (ช่วงเช้า/บ่าย)
        activity: ซ้อมรับปริญญา
        location: หอประชุมมหิดลสิทธาคาร มหาวิทยาลัยมหิดล
        notes: คาดว่าจะจัดในช่วงเช้าถึงบ่ายต้น
      - time: รอยืนยัน (ช่วงบ่าย)
        activity: ถ่ายรูปกับเพื่อนร่วมชั้น
        location: หอประชุมมหิดลสิทธาคาร / วิทยาเขตศาลายา
        notes: ถ่ายรูปรวมกับเพื่อนและชั้นเรียน
      - time: รอยืนยัน (ช่วงบ่าย)
        activity: ถ่ายรูปกับครอบครัว
        location: หอประชุมมหิดลสิทธาคาร / วิทยาเขตศาลายา
        notes: ถ่ายรูปครอบครัวและรูปเดี่ยว
      - time: รอยืนยัน (ช่วงบ่าย/เย็น)
        activity: เดินทางไปร้านอาหาร
        location: รอยืนยัน
        notes: เผื่อเวลาสำหรับการเดินทาง
      - time: รอยืนยัน (ช่วงเย็น)
        activity: รับประทานอาหารเย็นกับครอบครัว
        location: ร้านอาหารรอยืนยัน
        notes: รับประทานอาหารร่วมกันหลังวันซ้อม
  - id: ceremony
    letter: B
    title: วันพิธีพระราชทานปริญญาบัตร
    date: วันที่ 5 หรือ 6 ตุลาคม 2569
    tone: contrast
    badge: วันพิธีจริง
    pros:
      - ได้รับปริญญาบัตรจริงแล้ว
    cons:
      - การจราจรติดมากกว่า
      - อาจมีบางคนมาถึงสาย
      - เหนื่อยมากกว่า
      - ร้านอาหารบริเวณใกล้เคียงมีคนแน่น
    rows:
      - time: รอยืนยัน (ช่วงเช้า/บ่าย)
        activity: ลงทะเบียนและเข้าร่วมพิธีพระราชทานปริญญาบัตร
        location: หอประชุมมหิดลสิทธาคาร มหาวิทยาลัยมหิดล
        notes: วันที่และเวลาที่แน่นอนรอยืนยัน
      - time: รอยืนยัน (ช่วงบ่าย)
        activity: ถ่ายรูปกับเพื่อนร่วมชั้น
        location: หอประชุมมหิดลสิทธาคาร / วิทยาเขตศาลายา
        notes: ถ่ายรูปรวมกับเพื่อนและชั้นเรียน
      - time: รอยืนยัน (ช่วงบ่าย)
        activity: ถ่ายรูปกับครอบครัว
        location: หอประชุมมหิดลสิทธาคาร / วิทยาเขตศาลายา
        notes: ถ่ายรูปครอบครัวและรูปเดี่ยว
      - time: รอยืนยัน (ช่วงบ่าย/เย็น)
        activity: เดินทางไปร้านอาหาร
        location: รอยืนยัน
        notes: เผื่อเวลาเพิ่มเนื่องจากการจราจร
      - time: รอยืนยัน (ช่วงเย็น)
        activity: รับประทานอาหารฉลองกับครอบครัว
        location: ร้านอาหารรอยืนยัน
        notes: ร้านอาหารใกล้เคียงอาจมีคนแน่น
