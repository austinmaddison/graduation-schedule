title: You are invited to Austin's Graduation!
description: Join me in October 2026 at Mahidol University in Salaya, Thailand.
faq:
  title: Frequently asked questions
  description: A few things guests often ask. More answers will appear here as details firm up.
  categories:
    - title: Graduation
      questions:
        - label: What degree are you graduating from?
          content: Computer Science.
        - label: Do you know the final dates yet?
          content: Not yet. The final dates and times aren't out because the other university programs haven't closed registration for the graduation ceremony yet. Once Mahidol confirms, this page will be updated.
    - title: Details
      questions:
        - label: What is the dress code?
          content: Come as you are.
        - label: What about travel and parking?
          content: For Plan B, road closures mean guest parking is not available inside the university.
        - label: Should I bring a gift?
          content: Only if you want to.
